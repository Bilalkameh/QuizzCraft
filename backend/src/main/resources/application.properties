server.address=127.0.0.1
spring.datasource.url=${QUIZZCRAFT_DB_URL:jdbc:postgresql://127.0.0.1:55432/quizzcraft}
spring.datasource.username=${QUIZZCRAFT_DB_USER:quizzcraft}
spring.datasource.password=${QUIZZCRAFT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
quizzcraft.auth.jwt-secret=${QUIZZCRAFT_JWT_SECRET:}
quizzcraft.auth.token-ttl=${QUIZZCRAFT_TOKEN_TTL:PT1H}
